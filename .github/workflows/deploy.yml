name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recycle-term-frontend/package-lock.json

      - name: Build backend
        run: cd recycle-term-backend && mvn clean package -DskipTests -q

      - name: Build frontend
        run: |
          cd recycle-term-frontend
          npm ci
          npm run build

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          TERM: dumb
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: TERM
          script_stop: true
          script: |
            export TERM=dumb
            echo "=== Deploy started ==="
            
            # Upload files via scp from runner
            echo "Waiting for file upload..."
            
      - name: Upload JAR
        run: |
          apt-get update -qq && apt-get install -y -qq sshpass > /dev/null 2>&1
          export SSHPASS='${{ secrets.SERVER_PASSWORD }}'
          sshpass -e scp -o StrictHostKeyChecking=no recycle-term-backend/target/recycle-term-backend-1.0.0.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/recycle-term-backend.jar

      - name: Upload frontend dist
        run: |
          export SSHPASS='${{ secrets.SERVER_PASSWORD }}'
          sshpass -e scp -r -o StrictHostKeyChecking=no recycle-term-frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/fe-dist/

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            # Backup database before deployment
            BACKUP_DIR="/opt/recycle-term/backups"
            TS=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/recycle_term_$TS.sql"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "mkdir -p $BACKUP_DIR"

            if echo '${{ secrets.ROOT_PASSWORD }}' | su -c "mysqldump recycle_term > $BACKUP_FILE"; then
              echo "DB backup created: $BACKUP_FILE"
            else
              APP_CFG="/opt/recycle-term/application-prod.yml"
              if [ -f "$APP_CFG" ]; then
                DB_USER=$(echo '${{ secrets.ROOT_PASSWORD }}' | su -c "grep -A6 '^spring:' $APP_CFG | grep 'username:' | head -1 | sed 's/.*username:[[:space:]]*//'" || true)
                DB_PASS=$(echo '${{ secrets.ROOT_PASSWORD }}' | su -c "grep -A6 '^spring:' $APP_CFG | grep 'password:' | head -1 | sed 's/.*password:[[:space:]]*//'" || true)
                if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                  echo '${{ secrets.ROOT_PASSWORD }}' | su -c "mysqldump -u'$DB_USER' -p'$DB_PASS' recycle_term > $BACKUP_FILE"
                  echo "DB backup created: $BACKUP_FILE"
                else
                  echo "ERROR: could not resolve DB credentials for backup"
                  exit 1
                fi
              else
                echo "ERROR: backup failed and application config not found"
                exit 1
              fi
            fi

            # Install JAR
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "install -m 755 /tmp/recycle-term-backend.jar /opt/recycle-term/recycle-term-backend.jar"
            
            # Deploy frontend
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "rm -rf /var/www/recycle-term/*"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "rm -rf /tmp/fe-deploy"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "mkdir -p /tmp/fe-deploy"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "cp -r /tmp/fe-dist/* /tmp/fe-deploy/"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "cp -r /tmp/fe-deploy/* /var/www/recycle-term/"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "chown -R nginx:nginx /var/www/recycle-term"
            
            # Restart backend
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "systemctl restart recycle-term"
            
            # Cleanup
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "rm -rf /tmp/recycle-term-backend.jar /tmp/fe-dist /tmp/fe-deploy"
            
            # Wait and verify
            sleep 5
            curl -sf http://localhost:8081/api/tasks/stats && echo " Backend OK" || echo "WARN: backend not ready"
