name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recycle-term-frontend/package-lock.json

      - name: Build backend
        run: cd recycle-term-backend && mvn clean package -DskipTests -q

      - name: Build frontend
        run: |
          cd recycle-term-frontend
          npm ci
          npm run build

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "recycle-term-backend/target/recycle-term-backend-1.0.0.jar"
          target: "/tmp/"
          strip_components: 3

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "recycle-term-frontend/dist/"
          target: "/tmp/fe-dist/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Install JAR
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "install -m 755 /tmp/recycle-term-backend-1.0.0.jar /opt/recycle-term/recycle-term-backend.jar"
            
            # Deploy frontend
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "rm -rf /var/www/recycle-term/*"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "cp -r /tmp/fe-dist/dist/* /var/www/recycle-term/"
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "chown -R nginx:nginx /var/www/recycle-term"
            
            # Restart backend
            echo '${{ secrets.ROOT_PASSWORD }}' | su -c "systemctl restart recycle-term"
            
            # Cleanup
            rm -rf /tmp/recycle-term-backend-1.0.0.jar /tmp/fe-dist
            
            # Wait and verify
            sleep 5
            curl -sf http://localhost:8081/api/tasks/stats || echo "WARN: backend not ready yet"
