server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/recycle_term?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.xiaohei: debug
    org.hibernate.SQL: debug

jwt:
  secret: recycle-term-jwt-secret-key-2026-must-be-32bytes
  expiration: 86400000
